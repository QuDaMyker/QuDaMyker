<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pham Quoc Danh — Engineering Field Notes</title>
  <desc id="desc">Editorial technical banner showing an event-driven system from mobile clients through services and Kafka to PostgreSQL.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, sans-serif; }
      .mono { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }
      .ink { fill: #181914; }
      .muted { fill: #65675e; }
      .rule { stroke: #181914; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .fine { stroke: #9a9b91; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .flow { stroke-dasharray: 7 9; animation: signal 10s linear infinite; }
      @keyframes signal { to { stroke-dashoffset: -160; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <g filter="url(#paper)">
    <rect width="1200" height="420" fill="#f1eee3"/>
    <rect x="28" y="26" width="1144" height="368" fill="none" class="rule"/>
    <line x1="28" y1="72" x2="1172" y2="72" class="rule"/>
    <line x1="765" y1="72" x2="765" y2="394" class="rule"/>

    <text x="52" y="55" class="mono ink" font-size="13" font-weight="600" letter-spacing="2.1">ENGINEERING FIELD NOTES / 01</text>
    <text x="786" y="55" class="mono muted" font-size="12" letter-spacing="1.2">HCMC 10.8231°N / 106.6297°E</text>
    <rect x="1073" y="39" width="76" height="18" fill="#b8ff32"/>
    <text x="1082" y="52" class="mono ink" font-size="10" font-weight="700" letter-spacing="1.4">ONLINE</text>

    <text x="52" y="154" class="sans ink" font-size="72" font-weight="700" letter-spacing="-4.4">PHAM QUOC</text>
    <text x="52" y="225" class="sans ink" font-size="72" font-weight="300" letter-spacing="-4.4">DANH</text>
    <rect x="52" y="253" width="362" height="34" fill="#b8ff32"/>
    <text x="64" y="276" class="mono ink" font-size="14" font-weight="700" letter-spacing="1.5">FULL-STACK SOFTWARE ENGINEER</text>

    <text x="52" y="328" class="sans ink" font-size="20" font-weight="500">Backend depth. Product instincts.</text>
    <text x="52" y="355" class="sans muted" font-size="16">Reliable systems from API to interface.</text>
    <text x="52" y="379" class="mono muted" font-size="11" letter-spacing="1.2">NESTJS / KAFKA / POSTGRESQL / AZURE / MOBILE</text>

    <text x="790" y="104" class="mono muted" font-size="11" letter-spacing="1.5">SYSTEM MAP / PRODUCTION</text>
    <line x1="790" y1="119" x2="1148" y2="119" class="fine"/>

    <rect x="790" y="145" width="104" height="46" fill="none" class="rule"/>
    <text x="809" y="173" class="mono ink" font-size="12">MOBILE</text>
    <rect x="944" y="145" width="116" height="46" fill="#181914"/>
    <text x="960" y="173" class="mono" fill="#f1eee3" font-size="12">GATEWAY</text>
    <rect x="1108" y="145" width="40" height="46" fill="#b8ff32"/>
    <text x="1128" y="174" class="mono ink" font-size="12" text-anchor="middle">01</text>

    <path d="M894 168 H944" fill="none" class="rule flow"/>
    <path d="M1002 191 V230" fill="none" class="rule flow"/>

    <rect x="790" y="230" width="258" height="58" fill="none" class="rule"/>
    <text x="808" y="254" class="mono muted" font-size="10" letter-spacing="1.3">BUSINESS CAPABILITY</text>
    <text x="808" y="275" class="mono ink" font-size="13">NESTJS SERVICES</text>
    <rect x="1080" y="230" width="68" height="58" fill="#181914"/>
    <text x="1114" y="263" class="mono" fill="#b8ff32" font-size="11" text-anchor="middle">KAFKA</text>

    <path d="M1048 259 H1080" fill="none" class="rule flow"/>
    <path d="M1114 288 V327 H1010" fill="none" class="rule flow"/>

    <rect x="790" y="327" width="220" height="42" fill="none" class="rule"/>
    <circle cx="811" cy="348" r="5" fill="#b8ff32" stroke="#181914"/>
    <text x="828" y="352" class="mono ink" font-size="12">POSTGRESQL / REDIS</text>
    <text x="1035" y="350" class="mono muted" font-size="10">TRACE 24/7</text>

    <circle cx="919" cy="168" r="3.5" fill="#b8ff32">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1148" y="379" class="mono muted" font-size="10" text-anchor="end" letter-spacing="1.2">UTC+7 / REV. 2026.07</text>
  </g>
</svg>
